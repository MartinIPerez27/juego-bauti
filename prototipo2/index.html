<title>Choque de Héroes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* Concepto: cómic impreso. Escenario fijo de 1280x720 escalado a la tablet en horizontal.
   Tinta azul marino, puntos de trama, primarios saturados. Un solo look (juego), sin tema claro. */
:root{
  --ink:#0b0e33; --bg:#141a52; --bg2:#222b8a; --paper:#fff4d6;
  --yellow:#ffd23f; --red:#ff3d52; --blue:#2fa8ff; --magenta:#ff4fa3; --green:#35d98a;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --display:'Bangers','Impact',sans-serif; --body:'Nunito','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:900;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
::selection{background:var(--yellow);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
#frame{position:relative;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:var(--bg);text-transform:uppercase;letter-spacing:.02em}
/* trama de puntos */
.dots{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.14) 0 2.2px,transparent 2.8px) 0 0/22px 22px}
.rays{position:absolute;inset:-40%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(47,168,255,.16) 0 7deg,transparent 7deg 15deg)}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s var(--ease-out),transform .25s var(--ease-out),visibility 0s .25s}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s var(--ease-out),transform .25s var(--ease-out)}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:.95}
.ink{color:var(--paper);-webkit-text-stroke:0;paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 8px 18px rgba(0,0,0,.45)}

/* botones */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  font-family:var(--display);letter-spacing:.04em;color:var(--ink);background:var(--yellow);
  border:5px solid var(--ink);border-radius:22px;padding:0 38px;height:96px;font-size:54px;
  box-shadow:0 10px 0 var(--ink),0 18px 26px rgba(0,0,0,.4);
  transition:transform .16s var(--ease-out),box-shadow .16s var(--ease-out),filter .16s}
.btn:active{transform:translateY(7px) scale(.98);box-shadow:0 3px 0 var(--ink),0 6px 12px rgba(0,0,0,.4)}
.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue)}
.btn[disabled]{filter:grayscale(.85) brightness(.7);pointer-events:none}
.btn svg{width:48px;height:48px}
.btn.xl{height:128px;font-size:76px;padding:0 70px;border-radius:30px}
.btn.xl svg{width:66px;height:66px}
.round{width:84px;height:84px;padding:0;border-radius:50%;font-size:0}
.round svg{width:44px;height:44px}
.back{position:absolute;left:32px;top:28px;z-index:5}
.snd{position:absolute;right:32px;top:28px;z-index:5;background:var(--paper)}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.06)}}

/* ===== carta ===== */
.card{position:relative;--side:var(--blue);width:var(--cw);height:calc(var(--cw)*1.5);font-size:calc(var(--cw)/10);
  border-radius:1.1em;border:.34em solid var(--ink);background:var(--ink);overflow:hidden;flex:none;
  box-shadow:0 .5em 1.1em rgba(0,0,0,.5)}
.card.bad{--side:var(--red)}.card.neutral{--side:var(--yellow)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:.3em .35em .32em;display:flex;align-items:center;justify-content:center;gap:.35em;
  font-family:var(--display);font-size:1.4em;line-height:1;color:#fff;background:var(--side);border-top:.2em solid var(--ink);text-shadow:0 .08em 0 var(--ink);
  background-image:radial-gradient(circle,rgba(0,0,0,.22) 0 .12em,transparent .16em);background-size:.5em .5em}
.card.neutral .nm{color:var(--ink);text-shadow:none}
.card .pw{flex:none;width:1.95em;height:1.95em;border-radius:50%;background:var(--paper);color:var(--ink);border:.13em solid var(--ink);
  display:grid;place-items:center;font-family:var(--body);font-weight:900;font-size:1.05em;line-height:1;text-shadow:none;letter-spacing:0;font-variant-numeric:lining-nums}
.card .nm span{flex:1;text-align:center;min-width:0}
.card .sh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%)}
.back-face{background:var(--bg2);display:grid;place-items:center;
  background-image:radial-gradient(circle,rgba(255,255,255,.22) 0 .16em,transparent .2em);background-size:.7em .7em}
.back-face svg{width:56%;filter:drop-shadow(0 .2em 0 var(--ink))}

/* ===== TÍTULO ===== */
#s-title .t1{position:absolute;left:70px;top:80px;font-size:168px;color:var(--yellow);transform:rotate(-4deg);transform-origin:0 100%;
  text-shadow:0 8px 0 var(--ink),0 0 0 var(--ink),0 16px 30px rgba(0,0,0,.5);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
#s-title .t2{position:absolute;left:96px;top:262px;font-size:132px;color:var(--red);transform:rotate(-4deg);
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink),0 16px 30px rgba(0,0,0,.5)}
#s-title .fan{position:absolute;right:30px;top:40px;width:470px;height:640px}
#s-title .fan .card{position:absolute;top:40px;left:50%;margin-left:-150px}
#s-title .go{position:absolute;left:70px;bottom:74px}
.rise{animation:rise .7s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
.fan .card{animation:fanin .8s var(--ease-out) both}
@keyframes fanin{from{opacity:0;transform:translateY(60px) rotate(0)}}

/* ===== MENÚ ===== */
.head{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:78px;color:var(--yellow);text-shadow:0 5px 0 var(--ink)}
#hub{position:absolute;left:70px;right:70px;top:124px;bottom:116px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:28px}
.tile{position:relative;border-radius:28px;border:6px solid var(--ink);overflow:hidden;text-align:left;background:var(--bg2);
  box-shadow:0 10px 0 var(--ink),0 18px 28px rgba(0,0,0,.4);transition:transform .16s var(--ease-out),box-shadow .16s var(--ease-out)}
.tile:active{transform:translateY(7px) scale(.985);box-shadow:0 3px 0 var(--ink)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(11,14,51,.92))}
.tile .lb{position:absolute;left:22px;bottom:16px;right:22px;z-index:2;font-family:var(--display);font-size:50px;line-height:.95;color:#fff;text-shadow:0 4px 0 var(--ink)}
.tile .tag{position:absolute;top:16px;right:16px;z-index:2;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:14px;
  font-family:var(--display);font-size:28px;padding:4px 14px;transform:rotate(4deg)}
.tile.soon img{filter:saturate(.45) brightness(.7)}
.tile.soon .tag{background:var(--paper)}
.tile .ic{position:absolute;left:18px;top:14px;z-index:2;width:72px;height:72px;border-radius:50%;background:var(--yellow);border:5px solid var(--ink);display:grid;place-items:center}
.tile .ic svg{width:42px;height:42px}
.tile.soon .ic{background:var(--paper)}

.voice{position:absolute;left:70px;right:70px;bottom:26px;height:64px;display:flex;gap:14px;align-items:center;font-family:var(--display);font-size:36px;color:var(--yellow)}
.voice select{flex:1;min-width:0;height:60px;border-radius:14px;border:4px solid var(--ink);background:var(--paper);color:var(--ink);font:900 21px var(--body);padding:0 14px;text-transform:uppercase}
.voice .btn{height:60px;font-size:34px;padding:0 26px;box-shadow:0 5px 0 var(--ink);border-width:4px}
/* ===== CONFIG ===== */
#s-config .head{font-size:62px;top:12px}
#s-config .pl{position:absolute;top:158px;width:520px;height:230px;border-radius:26px;border:6px solid var(--ink);padding:22px 26px;
  background:var(--bg2);box-shadow:0 10px 0 var(--ink),0 18px 26px rgba(0,0,0,.35)}
#s-config .pl.a{left:70px;border-top-color:var(--blue)}#s-config .pl.b{right:70px;border-top-color:var(--red)}
.pl .who{font-family:var(--display);font-size:38px;line-height:1;color:var(--yellow)}
.pl input{width:100%;margin-top:8px;height:72px;border-radius:18px;border:5px solid var(--ink);background:var(--paper);color:var(--ink);
  font-family:var(--display);font-size:56px;text-transform:uppercase;padding:0 20px;letter-spacing:.04em}
.pl input::selection{background:var(--blue);color:#fff}
.seg{display:flex;gap:10px;margin-top:12px}
.seg button{flex:1;height:54px;border-radius:16px;border:4px solid var(--ink);background:var(--bg);font-family:var(--display);font-size:32px;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .16s var(--ease-out),background .16s}
.seg button svg{width:34px;height:34px}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--yellow);color:var(--ink)}
.steps{position:absolute;left:70px;right:70px;top:402px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.stp{border-radius:26px;border:6px solid var(--ink);background:var(--bg2);padding:16px 18px 18px;text-align:center;box-shadow:0 8px 0 var(--ink)}
.stp .lbl{font-family:var(--display);font-size:34px;color:var(--yellow);line-height:1}
.stp .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.stp .val{font-family:var(--display);font-size:92px;line-height:1;min-width:110px;color:#fff;text-shadow:0 5px 0 var(--ink)}
.stp .btn{width:76px;height:76px;padding:0;border-radius:50%;font-size:0;box-shadow:0 7px 0 var(--ink)}
.stp .btn svg{width:40px;height:40px}
.hint{position:absolute;left:70px;right:560px;bottom:30px;font-size:23px;line-height:1.25;color:var(--paper)}
.hint.warn{color:var(--yellow)}
#s-config .btn.go{position:absolute;right:70px;bottom:24px}

/* ===== MEMORIA ===== */
.side{position:absolute;top:14px;height:66px;display:flex;align-items:center;gap:16px;padding:0 22px;border-radius:20px;border:5px solid var(--ink);background:var(--bg2);
  transition:box-shadow .3s var(--ease-out);box-shadow:0 6px 0 var(--ink)}
.side.a{left:30px}.side.b{right:30px;flex-direction:row-reverse}
.side .nm{font-family:var(--display);font-size:38px;line-height:1;text-shadow:0 4px 0 var(--ink)}
.side.a .nm{color:var(--blue)}.side.b .nm{color:var(--red)}
.side .sc{font-family:var(--display);font-size:50px;line-height:1;min-width:34px;text-align:center;color:#fff;text-shadow:0 4px 0 var(--ink)}
.side .sc.bump{animation:bump .4s var(--ease-out)}
@keyframes bump{40%{transform:scale(1.3)}}
#mturn{position:absolute;left:50%;top:14px;translate:-50% 0;height:66px;display:flex;align-items:center;gap:12px;font-family:var(--display);font-size:40px;color:var(--yellow);text-shadow:0 4px 0 var(--ink);white-space:nowrap}
#mturn .pip{width:26px;height:26px;border-radius:50%;border:4px solid var(--ink);background:var(--bg2);transition:background .15s,transform .2s var(--ease-out)}
#mturn .pip.on{background:var(--yellow);transform:scale(1.15)}
.thumb{width:44px;height:66px;border:3px solid var(--ink);border-radius:8px;object-fit:cover;object-position:50% 18%;background:var(--ink)}
.thumb.pop{animation:pop .36s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.side.turn{box-shadow:0 6px 0 var(--ink),0 0 0 5px var(--yellow)}
#board{position:absolute;left:30px;right:30px;top:98px;bottom:22px;perspective:1100px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--yellow) var(--bg2)}
#board .bi{position:relative;width:100%}
.slot{position:absolute;transition:transform .16s var(--ease-out)}
.slot:active:not(:disabled){transform:scale(.96)}
.slot[disabled]{pointer-events:none}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s var(--ease-out)}
.slot.up .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.fr{transform:rotateY(180deg)}
.slot.nope .flip{animation:nope .45s var(--ease-out)}
@keyframes nope{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}
.slot.ok .face .card{box-shadow:0 0 0 .3em var(--yellow),0 .5em 1.1em rgba(0,0,0,.5)}
.slot.gone{visibility:hidden}
.fly{position:absolute;z-index:30;background-size:cover;background-position:50% 18%;border:5px solid var(--ink);border-radius:14px;pointer-events:none;will-change:transform}
.banner{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:20;font-size:110px;color:var(--yellow);text-shadow:0 7px 0 var(--ink),0 18px 30px rgba(0,0,0,.5);
  white-space:nowrap;pointer-events:none;opacity:0;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.banner.show{animation:banner 1.5s var(--ease-out) both}
@keyframes banner{0%{opacity:0;transform:scale(.8) rotate(-4deg)}18%{opacity:1;transform:scale(1.05) rotate(-4deg)}80%{opacity:1;transform:rotate(-4deg)}100%{opacity:0;transform:rotate(-4deg)}}

/* ===== EQUIPOS ===== */
#s-team .tt{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:70px;color:var(--yellow);text-shadow:0 5px 0 var(--ink)}
#s-team .tt span{color:#fff}
#coll{position:absolute;left:60px;right:60px;top:130px;height:350px;overflow-y:auto;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--yellow) var(--bg2);display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:flex-start;padding-top:20px}
.pick{position:relative;transition:transform .2s var(--ease-out)}
.pick:active{transform:scale(.96)}
.pick.sel{transform:translateY(-14px)}
.pick .ck{position:absolute;top:-14px;right:-14px;width:54px;height:54px;border-radius:50%;background:var(--green);border:5px solid var(--ink);display:grid;place-items:center;
  opacity:0;transform:scale(.6);transition:opacity .16s,transform .2s var(--ease-out);z-index:4}
.pick.sel .ck{opacity:1;transform:none}
.pick .ck svg{width:30px;height:30px}
.pick.sel .card{box-shadow:0 0 0 .3em var(--yellow),0 .5em 1.1em rgba(0,0,0,.5)}
#slots{position:absolute;left:0;right:0;bottom:48px;height:200px;display:flex;gap:26px;justify-content:center;align-items:flex-end}
.slotph{width:120px;height:180px;border:6px dashed rgba(255,244,214,.45);border-radius:18px;display:grid;place-items:center}
.slotph svg{width:60px;height:60px;opacity:.4}
#s-team .btn.go{position:absolute;right:50px;bottom:50px}
#s-team .ai{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:64px;color:var(--paper);text-shadow:0 5px 0 var(--ink)}

/* ===== BATALLA ===== */
.score{position:absolute;top:12px;left:30px;right:30px;height:64px;display:flex;justify-content:space-between;align-items:center}
.score .p{display:flex;align-items:center;gap:16px;background:var(--bg2);border:5px solid var(--ink);border-radius:18px;height:60px;padding:0 22px;box-shadow:0 5px 0 var(--ink)}
.score .p .n{font-family:var(--display);font-size:36px;line-height:1}
.score .p.a .n{color:var(--blue)}.score .p.b .n{color:var(--red)}
.score .p .v{font-family:var(--display);font-size:50px;line-height:1;color:#fff;text-shadow:0 4px 0 var(--ink);min-width:44px;text-align:center}
.score .v.bump{animation:bump .5s var(--ease-out)}
.score .rd{font-family:var(--display);font-size:36px;color:var(--yellow);text-shadow:0 4px 0 var(--ink)}
.team{position:absolute;top:92px;height:268px;width:560px;display:flex;gap:14px;align-items:flex-start;justify-content:center}
.team.a{left:30px}.team.b{right:30px}
.team .card{transition:filter .4s,opacity .4s,transform .5s var(--ease-out)}
.team.win .card{box-shadow:0 0 0 .3em var(--yellow),0 .5em 1.1em rgba(0,0,0,.5)}
.team.lose .card{filter:saturate(.7) brightness(.85)}
.pwr{position:absolute;top:354px;width:300px;height:72px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--paper);color:var(--ink);
  border:5px solid var(--ink);border-radius:20px;font-family:var(--display);font-size:62px;box-shadow:0 6px 0 var(--ink);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .3s var(--ease-out)}
.pwr.show{opacity:1;transform:none}
.pwr svg{width:44px;height:44px}
.pwr.a{left:160px}.pwr.b{right:160px}
.chips{position:absolute;top:438px;width:560px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips.a{left:30px}.chips.b{right:30px}
.chip{font-family:var(--display);font-size:25px;line-height:1;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:4px 10px;
  animation:pop .35s var(--ease-out) both}
.chip b{font-weight:400;color:var(--red)}
.vs{position:absolute;left:50%;top:160px;translate:-50% 0;z-index:6;font-family:var(--display);font-size:112px;color:var(--yellow);line-height:1;opacity:0;
  -webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink)}
.vs.show{animation:vs .6s var(--ease-out) both}
@keyframes vs{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}60%{opacity:1;transform:scale(.95) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
.cap{position:absolute;left:30px;right:360px;bottom:22px;height:128px;background:var(--paper);color:var(--ink);border:6px solid var(--ink);border-radius:18px;
  padding:12px 22px;display:flex;align-items:center;font-family:var(--display);font-size:46px;line-height:1.02;box-shadow:0 8px 0 var(--ink)}
.cap span{display:block;animation:line .28s var(--ease-out) both}
@keyframes line{from{opacity:0;transform:translateY(10px)}}
#s-battle .btn.next{position:absolute;right:30px;bottom:30px;height:112px;width:310px;font-size:50px;padding:0}
.skip{position:absolute;right:30px;bottom:150px;width:310px;height:56px;font-size:30px;font-family:var(--display);color:var(--paper);opacity:.75}
.fx{position:absolute;pointer-events:none;z-index:40;border-radius:3px;will-change:transform}

/* ===== BIBLIOTECA ===== */
#lib{position:absolute;left:40px;right:40px;top:120px;bottom:20px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-content:flex-start;padding:16px 10px 40px;
  scrollbar-width:thin;scrollbar-color:var(--yellow) var(--bg2)}
#lib::-webkit-scrollbar{width:12px}#lib::-webkit-scrollbar-thumb{background:var(--yellow);border-radius:8px;border:3px solid var(--bg)}
.lc{transition:transform .16s var(--ease-out)}.lc:active{transform:scale(.96)}
#det{position:absolute;inset:0;z-index:10;background:rgba(11,14,51,.99);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
#det.on{opacity:1;visibility:visible;transition:opacity .2s}
#det .big{position:absolute;left:100px;top:90px}
#det .info{position:absolute;left:500px;right:150px;top:30px}
#det h2{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:74px;line-height:.95;color:var(--yellow);text-shadow:0 5px 0 var(--ink)}
.bar{display:grid;grid-template-columns:200px 1fr 64px;align-items:center;gap:14px;margin-bottom:8px;font-family:var(--display);font-size:32px}
.bar i{display:block;height:28px;border-radius:12px;background:var(--ink);border:4px solid var(--ink);overflow:hidden}
.bar i u{display:block;height:100%;width:var(--v);background:var(--c);border-radius:8px;transform-origin:0 50%;animation:grow .7s var(--ease-out) both;
  background-image:radial-gradient(circle,rgba(0,0,0,.2) 0 2px,transparent 2.5px);background-size:9px 9px}
@keyframes grow{from{transform:scaleX(0)}}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}

const ELC={MAGIA:'#b05cff',FUERZA:'#ff7a3d',MENTE:'#35d98a',TECNOLOGIA:'#2fa8ff',ENERGIA:'#ffd23f'};
const STK=['inteligencia','fuerza','velocidad','aguante','poder','combate'];
const STATL={inteligencia:'CEREBRO',fuerza:'FUERZA',velocidad:'VELOCIDAD',aguante:'AGUANTE',poder:'PODER',combate:'COMBATE'};
const STATC={inteligencia:'#2fa8ff',fuerza:'#ff3d52',velocidad:'#ffd23f',aguante:'#35d98a',poder:'#ff4fa3',combate:'#ff9a3d'};
const CARDS=DATA.chars.map(c=>({id:String(c.id),name:c.n,side:c.al==='HEROE'?'good':c.al==='VILLANO'?'bad':'neutral',stats:Object.fromEntries(STK.map((k,i)=>[k,c.st[i]])),

/* ===== MOTOR DE REGLAS (arena + elementos; el resultado sale de los números, la voz solo lo cuenta) ===== */
let curArena=null;
const ARENAS=DATA.arenas, MULT=DATA.params.arena_multiplicador||3;
const ELBY=Object.fromEntries(DATA.elements.map(e=>[e.k,e]));
const pickOne=a=>a[rnd(a.length)];
function pickArena(){return pickOne(ARENAS)}
function arenaScore(c,ar){let sum=0,w=0;STK.forEach(k=>{const m=(k===ar.a||k===ar.b)?MULT:1;sum+=c.stats[k]*m;w+=m});return sum/w}
function beats(e1,e2){return DATA.rules.find(r=>r.a===e1&&r.d===e2)}
function evaluate(A,B){
  const ar=curArena||pickArena();
  const side=(me,ot)=>{
    const sc=me.map(c=>arenaScore(c,ar)),base=sc.reduce((s,x)=>s+x,0),r=[];
    const grp={};
    me.forEach((c,i)=>{const hit=ot.map(o=>beats(c.el,o.el)).find(Boolean);
      if(hit){const key=c.el+'>'+hit.d,b=Math.max(1,Math.round(sc[i]*hit.b));
        if(grp[key]){grp[key].b+=b;grp[key].n++}else{grp[key]={k:'el',b,t:hit.t,who:c.name,a:ELBY[c.el].l,d:ELBY[hit.d].l,n:1};r.push(grp[key])}}});
    const tot=base+r.reduce((s,x)=>s+x.b,0);
    const best=me[sc.indexOf(Math.max(...sc))];
    const sums=Object.fromEntries(STK.map(k=>[k,me.reduce((s,c)=>s+c.stats[k],0)]));
    return{base:Math.round(base),r,total:Math.round(tot),best,sums,sc}};
  const a=side(A,B),b=side(B,A);
  return{a,b,ar,win:a.total===b.total?-1:(a.total>b.total?0:1)}}
function chipText(x){return x.k==='el'?`${x.a} VENCE A ${x.d}${x.n>1?' ×'+x.n:''}`:'';}
function narrate(res,A,B){
  const L=[],N=S.names,ar=res.ar;
  L.push(pickOne(['¡QUÉ PELEA!','¡MIRÁ QUÉ DUELO!','¡ESTO SE PONE PICANTE!','¡ATENCIÓN, EMPIEZA EL COMBATE!']));
  L.push(`LA ARENA ES ${ar.l}. AQUÍ IMPORTAN ${STATL[ar.a]} Y ${STATL[ar.b]}.`);
  L.push(`${N[0]} TIENE A ${res.a.best.name}. ${N[1]} TIENE A ${res.b.best.name}.`);
  if(res.win<0){L.push('¡ESTÁN PAREJÍSIMOS, NO SE PUEDE DECIDIR!');L.push('¡EMPATE! ¡PUNTO PARA LOS DOS!');return L}
  const w=res.win?res.b:res.a,l=res.win?res.a:res.b,wn=N[res.win],ln=N[res.win^1];
  const W=res.win?B:A,Lo=res.win?A:B;
  // ¿la arena favorecía al que perdió? (la arena no decide sola)
  const favL=Lo.reduce((s,c)=>s+c.stats[ar.a]+c.stats[ar.b],0)/Lo.length, favW=W.reduce((s,c)=>s+c.stats[ar.a]+c.stats[ar.b],0)/W.length;
  if(favL>favW)L.push(`AUNQUE LA ARENA AYUDABA A ${ln}, EL OTRO EQUIPO ES MUCHO MÁS FUERTE.`);
  else L.push(`EN ${STATL[ar.a]} Y ${STATL[ar.b]}, ${wn} TIENE MÁS PODER.`);
  const el=w.r[0];if(el)L.push(`¡${el.who} ES DE ${el.a} Y LE GANA A ${el.d}! ${el.t}.`);
  // el rasgo en el que más se distancian los equipos
  const dk=STK.map(k=>[k,(w.sums[k]-l.sums[k])/W.length]).sort((x,y)=>y[1]-x[1])[0];
  if(dk&&dk[1]>10)L.push(`EL EQUIPO DE ${wn} ES MUCHO MEJOR EN ${STATL[dk[0]]}.`);
  if(A.length!==B.length)L.push('¡Y UN EQUIPO MÁS GRANDE SIEMPRE AYUDA!');
  if(Math.abs(w.total-l.total)<=Math.max(8,w.total*0.05))L.push(`¡PERO ${ln} ESTUVO MUY CERCA!`);
  L.push(pickOne([`¡GANA ${wn}! ¡UN PUNTO!`,`¡PUNTO PARA ${wn}!`,`¡${wn} SE LLEVA ESTA RONDA!`]));return L}

function sr(seed){let h=seed*2654435761>>>0;return()=>{h=Math.imul(h^h>>>15,2246822507)>>>0;h=Math.imul(h^h>>>13,3266489909)>>>0;h^=h>>>16;return(h>>>0)/4294967296}}
const SV=(defs,body)=>`<svg viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice"><defs>${defs}</defs>${body}</svg>`;
const lin=(id,a,stops)=>`<linearGradient id="${id}" x1="0" y1="0" x2="${a?1:0}" y2="${a?0:1}">${stops.map(([o,c,op])=>`<stop offset="${o}" stop-color="${c}" stop-opacity="${op==null?1:op}"/>`).join('')}</linearGradient>`;
const rad=(id,stops)=>`<radialGradient id="${id}">${stops.map(([o,c,op])=>`<stop offset="${o}" stop-color="${c}" stop-opacity="${op==null?1:op}"/>`).join('')}</radialGradient>`;
function skyline(seed,base,minH,maxH,color,win,wcolor,wprob){const r=sr(seed);let x=-20,o='';
  while(x<1300){const w=50+r()*80,h=minH+r()*(maxH-minH);o+=`<rect x="${x|0}" y="${base-h|0}" width="${w|0}" height="${h|0}" fill="${color}"/>`;
    if(win)for(let wy=base-h+14;wy<base-14;wy+=22)for(let wx=x+10;wx<x+w-14;wx+=18)if(r()<wprob)o+=`<rect x="${wx|0}" y="${wy|0}" width="8" height="11" fill="${wcolor}" opacity="${.5+r()*.5}"/>`;
    x+=w+4+r()*10}return o}
function stars(seed,n,ymax,tw){const r=sr(seed);let o='';for(let i=0;i<n;i++){const big=r()<.12;o+=`<circle class="${tw&&r()<.5?'tw':''}" style="animation-delay:${(r()*4).toFixed(1)}s" cx="${(r()*1280)|0}" cy="${(r()*ymax)|0}" r="${big?2.4:r()*1.3+.5}" fill="#fff" opacity="${.4+r()*.6}"/>`}return o}
function embers(seed,n,color,x0,x1,y0){const r=sr(seed);let o='';for(let i=0;i<n;i++)o+=`<circle class="ember" style="animation-delay:${(r()*5).toFixed(1)}s;animation-duration:${(3+r()*4).toFixed(1)}s" cx="${(x0+r()*(x1-x0))|0}" cy="${y0}" r="${(1.5+r()*3).toFixed(1)}" fill="${color}"/>`;return o}
function rain(seed,n,color){const r=sr(seed);let o='';for(let i=0;i<n;i++){const x=(r()*1300)|0;o+=`<line class="drop" style="animation-delay:${(r()*1).toFixed(2)}s;animation-duration:${(.5+r()*.5).toFixed(2)}s" x1="${x}" y1="-30" x2="${x-14}" y2="0" stroke="${color}" stroke-width="2" opacity=".5"/>`}return o}

async function battle(A,B){
  SKIP=false;curArena=FORCE_ARENA||pickArena();const res=evaluate(A,B),lines=narrate(res,A,B);
  go('battle');
  $('#bn0').textContent=S.names[0];$('#bn1').textContent=S.names[1];$('#bs0').textContent=S.score[0];$('#bs1').textContent=S.score[1];
  $('#brd').innerHTML=`RONDA ${S.round} DE ${S.rounds} · ${curArena.l}<br><small style="font-size:.72em;color:#fff">VALEN MÁS: ${STATL[curArena.a]} Y ${STATL[curArena.b]}</small>`;
  $('#s-battle').classList.toggle('compact',A.length>=4);
  ['#ta','#tb'].forEach(s=>{$(s).className='team '+(s==='#ta'?'a':'b');$(s).innerHTML=''});
  ['#pa','#pb'].forEach(s=>{$(s).classList.remove('show');$('span',$(s)).textContent='0'});
  ['#ca','#cb'].forEach(s=>$(s).innerHTML='');
  $('#vs').classList.remove('show');$('#cap').innerHTML='';$('#b-next').hidden=true;$('#b-skip').hidden=false;
  const cwFor=n=>Math.min(n>=3?158:172,Math.floor((560-14*(n-1))/n));
  const place=(sel,T,from)=>{T.forEach((c,i)=>{const e=cardEl(c,cwFor(T.length));$(sel).append(e);
    if(!REDUCE)e.animate([{transform:`translateX(${from*520}px) rotate(${from*14}deg)`,opacity:0},{transform:'none',opacity:1}],{duration:520,delay:i*130,easing:'cubic-bezier(.23,1,.32,1)',fill:'backwards'});})};
  const cap=t=>{$('#cap').innerHTML=`<span>${t}</span>`};
  const stop=()=>SKIP;
  // 0) la arena
  setScene(curArena);
  $('#abn').innerHTML=`<div class="al">¡LA ARENA DE HOY!</div><div class="an">${curArena.l}</div><div class="as"><span class="st2" style="--c:${STATC[curArena.a]}">${STATL[curArena.a]}</span><span class="st2" style="--c:${STATC[curArena.b]}">${STATL[curArena.b]}</span></div><div class="al">AQUÍ VALEN MÁS ESTAS DOS</div>`;
  $('#abn').classList.add('on');sfx('slam');await sleep(stop()?300:2100);$('#abn').classList.remove('on');
  // 1) entran las cartas
  sfx('go');place('#ta',A,-1);place('#tb',B,1);await sleep(700+Math.max(A.length,B.length)*130);
  // 2) cuenta de poder
  $('#pa').classList.add('show');$('#pb').classList.add('show');
  await countUp([['#pa',res.a.base],['#pb',res.b.base]],stop()?0:800);
  // 3) choque
  $('#vs').classList.add('show');sfx('slam');buzz(60);shake();await sleep(stop()?0:700);
  // 4) bonos
  for(const [side,sel,list] of [['a','#ca',res.a.r],['b','#cb',res.b.r]]){
    for(const x of list){const c=document.createElement('div');c.className='chip';c.innerHTML=`${chipText(x)} <b>+${x.b}</b>`;$(sel).append(c);sfx('pop');await sleep(stop()?0:260)}}
  await countUp([['#pa',res.a.total,res.a.base],['#pb',res.b.total,res.b.base]],stop()?0:700);
  // 5) narración
  for(const t of lines.slice(0,-1)){if(stop())break;cap(t);await speak(t);await sleep(stop()?0:180)}
  // 6) resultado
  cap(lines[lines.length-1]);
  if(res.win>=0){S.score[res.win]++;$(res.win?'#tb':'#ta').classList.add('win');$(res.win?'#ta':'#tb').classList.add('lose');confetti(res.win?900:380)}
  else{S.score[0]++;S.score[1]++;$('#ta').classList.add('win');$('#tb').classList.add('win')}
  [0,1].forEach(i=>{const v=$('#bs'+i);v.textContent=S.score[i];v.classList.remove('bump');void v.offsetWidth;v.classList.add('bump')});
  sfx('win');buzz([30,40,30]);$('#b-skip').hidden=true;
  const last=S.round>=S.rounds;$('#b-next').innerHTML=(last?'¡RESULTADO!':'SIGUIENTE')+icon('i-play');$('#b-next').hidden=false;
  if(!SKIP)await speak(lines[lines.length-1])}
$('#b-skip').onclick=()=>{SKIP=true;stopSpeech()};

function countUp(items,dur){return new Promise(res=>{if(!dur){items.forEach(([s,to])=>$('span',$(s)).textContent=to);return res()}
  const t0=performance.now();let last=-1;(function f(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    items.forEach(([s,to,from=0])=>$('span',$(s)).textContent=Math.round(from+(to-from)*e));const q=Math.floor(k*10);if(q!==last){last=q;sfx('tick')}
    k<1?requestAnimationFrame(f):res()})(t0)})}
function shake(){const f=$('#flash');if(REDUCE)return;f.animate([{opacity:.85},{opacity:0}],{duration:260,easing:'ease-out'});
  stage.animate([{translate:'0 0'},{translate:'-14px 8px'},{translate:'12px -8px'},{translate:'-8px -4px'},{translate:'4px 4px'},{translate:'0 0'}],{duration:380,easing:'cubic-bezier(.23,1,.32,1)'})}
function confetti(cx){if(REDUCE)return;const cols=['#ffd23f','#ff3d52','#2fa8ff','#35d98a','#ff4fa3','#fff4d6'];
  for(let i=0;i<46;i++){const e=document.createElement('i');e.className='fx';const w=8+rnd(10);e.style.cssText=`left:${cx}px;top:300px;width:${w}px;height:${w*1.5}px;background:${cols[rnd(6)]}`;stage.append(e);
    const dx=(Math.random()-.5)*620,dy=-180-Math.random()*260;
    e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx*.6}px,${dy}px) rotate(${rnd(360)}deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy+520}px) rotate(${rnd(720)}deg)`,opacity:0}],
      {duration:1500+rnd(700),easing:'cubic-bezier(.2,.6,.3,1)',fill:'forwards'}).finished.then(()=>e.remove())}}

function smpFrom(pool,n){const a=[...pool];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function smp(n,rng){const a=[...(WITHIMG.length>=n?WITHIMG:CARDS)],r=rng||Math.random;for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function seedRng(str){let h=1779033703;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19}
  return()=>{h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return(h>>>0)/4294967296}}

  const fresh=()=>{const pool=(WITHIMG.length>=40?WITHIMG:CARDS).filter(c=>!seen.has(c.id)),a=smpFrom(pool,5);a.forEach(c=>seen.add(c.id));return a};
  for(let r=1;r<=R;r++)for(const p of [0,1]){
    const opts=fresh();pkShow('DRAFT',`RONDA ${r} DE ${R} · <span style="color:${p?'var(--red)':'var(--blue)'}">ELIGE ${names[p]}</span>`,opts,[],{w:176,ab:true});$('#pkbar').hidden=true;
    draftStrip(teams,names);

    if(!two&&p===1){await sleep(1200);pick=[...$$('#pkgrid .pkc')].sort((x,y)=>BYID[y.dataset.id].pw-BYID[x.dataset.id].pw)[0]}
    else pick=await new Promise(rs=>{$('#pkgrid').onclick=e=>{const b=e.target.closest('.pkc');if(b){sfx('tap');rs(b)}}});
    const c=BYID[pick.dataset.id];$$('#pkgrid .pkc').forEach(b=>b.classList.toggle('gone',b!==pick));pick.classList.add('sel');sfx('match');teams[p].push(c);draftStrip(teams,names);
    const say=(two||p===0?`¡ELEGISTE A ${c.name}!`:`¡${names[p]} ELIGIÓ A ${c.name}!`)+(c.ab?` ${c.ab}.`:'');
    $('#pkS').textContent=say;SKIP=false;await speak(say);await sleep(300)}
  await sleep(500);
  runBattle(teams[0],teams[1],names,null,(win,tie)=>showRes(tie?'¡EMPATE!':`¡GANÓ ${names[win?0:1]}!`,'CADA UNO ARMÓ SU EQUIPO ELIGIENDO UNA CARTA POR TURNO',startDraft))}

    await sleep(55+i*i*3.2);}

  PV.slots=[{},{}];PV.turn=0;PV.busy=false;PV.cur=null;go('pvp');
  $('#pvr').textContent=`RONDA ${PV.round} DE ${S.rounds}`;pvDraw();pvTurn()}
function pvDraw(){[0,1].forEach(p=>{const box=$('#pv'+p);const filled=Object.keys(PV.slots[p]).length;
  box.innerHTML=`<div class="pn ${p?'b':'a'}">${S.names[p]}<small>${PV.score[p]}</small></div>`+STK.map(k=>{const v=PV.slots[p][k];
    return `<div class="sl ${v==null?'empty':''}">${v==null?`<span class="rl">${STATL[k]}</span><i></i><span class="rv">?</span>`:rowHTML(k,v)}</div>`}).join('')+
    `<div class="pm">${filled?Math.round(STK.reduce((s,k)=>s+(PV.slots[p][k]||0),0)/6):'—'}<small>PROMEDIO</small></div>`;
  box.classList.toggle('turn',PV.turn===p&&filled<6)})}
async function pvTurn(){
  if(PV.turn===0&&Object.keys(PV.slots[0]).length===6&&Object.keys(PV.slots[1]).length===6)return pvCompare();
  const p=PV.turn;pvDraw();const btn=$('#pvspin'),card=$('#pvcard'),opts=$('#pvopts');
  opts.innerHTML='';card.innerHTML='';btn.hidden=S.ai[p];$('#pvmsg').textContent=S.ai[p]?`GIRA ${S.names[p]}…`:`¡GIRÁ, ${S.names[p]}!`;
  if(S.ai[p]){await sleep(800);return pvSpin()}
}
async function pvSpin(){
  if(PV.busy)return;PV.busy=true;const p=PV.turn;$('#pvspin').hidden=true;
  const target=pickOne(POOL());PV.cur=target;ac();
  await roulette($('#pvcard'),target);
  const free=STK.filter(k=>PV.slots[p][k]==null);$('#pvmsg').textContent=S.ai[p]?'':'ELEGÍ UNA ESTADÍSTICA';
  const opts=$('#pvopts');opts.innerHTML='';
  free.forEach(k=>{const b=document.createElement('button');b.className='opt';b.innerHTML=`<span class="rl">${STATL[k]}</span><b>${target.stats[k]}</b>`;
    b.style.setProperty('--c',STATC[k]);b.style.setProperty('--w',target.stats[k]+'%');b.onclick=()=>{if(!S.ai[p])pvPick(k)};opts.append(b)});
  PV.busy=false;
  if(S.ai[p]){await sleep(900);const best=free.map(k=>[k,pctOf(k,target.stats[k])]).sort((a,b)=>b[1]-a[1])[0][0];pvPick(best)}
}
async function pvPick(k){
  if(PV.busy)return;PV.busy=true;const p=PV.turn;PV.slots[p][k]=PV.cur.stats[k];sfx('match');buzz(15);
  const said=S.ai[p]?`¡${S.names[p]} ELIGIÓ ${ART[k]} ${STATL[k]} DE ${PV.cur.name}!`:`¡ELEGISTE ${ART[k]} ${STATL[k]} DE ${PV.cur.name}!`;
  $('#pvmsg').textContent=said;$('#pvopts').innerHTML='';pvDraw();SKIP=false;await speak(said);await sleep(250);PV.busy=false;PV.turn^=1;
  if(Object.keys(PV.slots[0]).length===6&&Object.keys(PV.slots[1]).length===6)return pvCompare();
  pvTurn()}
async function pvCompare(){
  const avg=p=>STK.reduce((s,k)=>s+PV.slots[p][k],0)/6,a=avg(0),b=avg(1);
  $('#pvspin').hidden=true;$('#pvopts').innerHTML='';$('#pvcard').innerHTML='';
  let msg,w=-1;if(Math.abs(a-b)<0.05){msg='¡EMPATE! PUNTO PARA LOS DOS';PV.score[0]++;PV.score[1]++}else{w=a>b?0:1;PV.score[w]++;msg=`¡GANA ${S.names[w]}! ${Math.round(Math.max(a,b))} CONTRA ${Math.round(Math.min(a,b))}`}
  $('#pvmsg').textContent=msg;pvDraw();sfx('win');if(w>=0)confetti(w?900:380);speak(msg.replace('¡','').toLowerCase());
  const nx=$('#pvnext');nx.hidden=false;nx.innerHTML=(PV.round>=S.rounds?'¡RESULTADO!':'SIGUIENTE')+icon('i-play')}
function pvFinal(){go('final');const[a,b]=PV.score,N=S.names;$('#fw').textContent=a===b?'¡EMPATE!':`¡GANA ${N[a>b?0:1]}!`;
  $('#fs').innerHTML=`${N[0]} <b>${a}</b> &nbsp;·&nbsp; <b>${b}</b> ${N[1]}`;sfx('win');confetti(640);S.last='pvp'}

/* ===== ELEGÍ UNO (individual; solo se gana con S+) ===== */
let UN=null;
const P=DATA.params,TIERS=[['C','elegiuno_corte_c'],['B','elegiuno_corte_b'],['A','elegiuno_corte_a'],['S','elegiuno_corte_s'],['S+','elegiuno_corte_smas']];
function startUno(){UN={locked:{},opts:{},busy:false,tries:(UN&&UN.tries||0)};go('uno');unoDraw();$('#unomsg').textContent='GIRÁ LA RULETA';$('#unospin').hidden=false;$('#unores').classList.remove('on')}
function unoDraw(){
  $('#unogrid').innerHTML=STK.map(k=>{const L=UN.locked[k],o=UN.opts[k];
    return `<div class="ut ${L?'lock':o?'ready':''}" data-k="${k}" style="--c:${STATC[k]}"><div class="uf">${L?faceHTML(L.c):o?faceHTML(o):'<div class="ph q"><span>?</span></div>'}</div>
    <div class="ui"><span class="rl">${STATL[k]}</span><b class="uv">${L?L.c.stats[k]:o?o.stats[k]:'—'}</b><small>${L?L.c.name:o?o.name:''}</small></div>${L?'<em>✔</em>':''}</div>`}).join('');
  $$('#unogrid .ut.ready').forEach(t=>t.onclick=()=>unoPick(t.dataset.k))}
async function unoSpin(){
  if(UN.busy)return;UN.busy=true;ac();$('#unospin').hidden=true;$('#unomsg').textContent='GIRANDO…';
  const free=STK.filter(k=>!UN.locked[k]);free.forEach(k=>UN.opts[k]=null);unoDraw();
  const tg={};free.forEach(k=>tg[k]=pickOne(CARDS));
  await Promise.all(free.map(async(k,i)=>{const el=$(`#unogrid .ut[data-k=${k}] .uf`);await sleep(i*180);await roulette(el,tg[k],10+i);UN.opts[k]=tg[k];}));
  unoDraw();UN.busy=false;$('#unomsg').textContent='ELEGÍ UNA OPCIÓN';}
async function unoPick(k){
  if(UN.busy)return;UN.busy=true;const cd=UN.opts[k];UN.locked[k]={c:cd};sfx('match');buzz(15);UN.opts={};unoDraw();
  const said=`¡ELEGISTE ${ART[k]} ${STATL[k]} DE ${cd.name}!`;$('#unomsg').textContent=said;SKIP=false;await speak(said);await sleep(200);UN.busy=false;
  const left=STK.filter(x=>!UN.locked[x]);
  if(!left.length)return unoResult();
  $('#unomsg').textContent=`QUEDAN ${left.length}. GIRÁ OTRA VEZ`;$('#unospin').hidden=false}
function unoTier(){
  const ps=STK.map(k=>pctOf(k,UN.locked[k].c.stats[k])),avg=ps.reduce((s,x)=>s+x,0)/6,mn=Math.min(...ps);
  let t='D';for(const[n,key]of TIERS)if(avg>=P[key])t=n;
  if(t==='S+'&&mn<(P.elegiuno_piso_splus||0.8))t='S';
  return{t,avg,mn,ps}}
function unoResult(){
  const r=unoTier(),win=r.t==='S+';UN.tries++;
  $('#unores').innerHTML=`<div class="tier ${win?'w':''}">${r.t}</div><div class="tt">${win?'¡GANASTE! ¡LO MEJOR DE CADA ESTADÍSTICA!':'NO ALCANZÓ PARA S+'}</div>
   <div class="ts">${STK.map((k,i)=>`<span style="--c:${STATC[k]}">${STATL[k]} ${UN.locked[k].c.stats[k]}${r.ps[i]<(P.elegiuno_piso_splus||.8)?' ↓':''}</span>`).join('')}</div>
   <div class="ta">INTENTO ${UN.tries}</div><button class="btn" id="unoagain">${icon('i-play')} OTRA VEZ</button><button class="btn blue" id="unomenu">MENÚ</button>`;
  $('#unores').classList.add('on');sfx(win?'win':'no');if(win){confetti(640);speak('¡Ganaste! ¡Lo mejor de cada estadística!')}else speak(`Salió ${r.t}. Probá otra vez.`);
  $('#unoagain').onclick=()=>{sfx('go');startUno()};$('#unomenu').onclick=()=>{sfx('tap');UN=null;go('hub')}}
$('#unospin').onclick=unoSpin;$('#pvspin').onclick=pvSpin;
$('#pvnext').onclick=()=>{$('#pvnext').hidden=true;sfx('go');PV.round>=S.rounds?pvFinal():pvRound()};

</script>
