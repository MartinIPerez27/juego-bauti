<title>La Batalla de Bauti</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
<style>
/* Concepto: cómic impreso. Escenario fijo de 1280x720 escalado a la tablet en horizontal.
   Tinta azul marino, puntos de trama, primarios saturados. Un solo look (juego), sin tema claro. */
:root{
  --ink:#0b0e33; --bg:#141a52; --bg2:#222b8a; --paper:#fff4d6;
  --yellow:#ffd23f; --red:#ff3d52; --blue:#2fa8ff; --magenta:#ff4fa3; --green:#35d98a;
  --ease-out:cubic-bezier(.23,1,.32,1); --ease-io:cubic-bezier(.77,0,.175,1);
  --display:'Bangers','Impact',sans-serif; --body:'Nunito','Arial Rounded MT Bold',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--paper);font-family:var(--body);font-weight:900;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
*{box-sizing:border-box}
::selection{background:var(--yellow);color:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
#frame{position:relative;width:100%;height:100%}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;
  background:var(--bg);text-transform:uppercase;letter-spacing:.02em}
/* trama de puntos */
.dots{position:absolute;inset:0;pointer-events:none;opacity:.5;
  background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.14) 0 2.2px,transparent 2.8px) 0 0/22px 22px}
.rays{position:absolute;inset:-40%;pointer-events:none;
  background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(47,168,255,.16) 0 7deg,transparent 7deg 15deg)}
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;transform:translateY(10px);
  transition:opacity .25s var(--ease-out),transform .25s var(--ease-out),visibility 0s .25s}
.screen.on{opacity:1;visibility:visible;transform:none;transition:opacity .25s var(--ease-out),transform .25s var(--ease-out)}
.disp{font-family:var(--display);font-weight:400;letter-spacing:.03em;line-height:.95}
.ink{color:var(--paper);-webkit-text-stroke:0;paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 8px 18px rgba(0,0,0,.45)}

/* botones */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:14px;
  font-family:var(--display);letter-spacing:.04em;color:var(--ink);background:var(--yellow);
  border:5px solid var(--ink);border-radius:22px;padding:0 38px;height:96px;font-size:54px;
  box-shadow:0 10px 0 var(--ink),0 18px 26px rgba(0,0,0,.4);
  transition:transform .16s var(--ease-out),box-shadow .16s var(--ease-out),filter .16s}
.btn:active{transform:translateY(7px) scale(.98);box-shadow:0 3px 0 var(--ink),0 6px 12px rgba(0,0,0,.4)}
.btn.red{background:var(--red);color:#fff}.btn.blue{background:var(--blue)}
.btn[disabled]{filter:grayscale(.85) brightness(.7);pointer-events:none}
.btn svg{width:48px;height:48px}
.btn.xl{height:128px;font-size:76px;padding:0 70px;border-radius:30px}
.btn.xl svg{width:66px;height:66px}
.round{width:84px;height:84px;padding:0;border-radius:50%;font-size:0}
.round svg{width:44px;height:44px}
.back{position:absolute;left:32px;top:28px;z-index:5}
.snd{position:absolute;right:32px;top:28px;z-index:5;background:var(--paper)}
@media (hover:hover) and (pointer:fine){.btn:hover{filter:brightness(1.06)}}

/* ===== carta ===== */
.card{position:relative;--side:var(--blue);width:var(--cw);height:calc(var(--cw)*1.5);font-size:calc(var(--cw)/10);
  border-radius:1.1em;border:.34em solid var(--ink);background:var(--ink);overflow:hidden;flex:none;
  box-shadow:0 .5em 1.1em rgba(0,0,0,.5)}
.card.bad{--side:var(--red)}.card.neutral{--side:var(--yellow)}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:.3em .35em .32em;display:flex;align-items:center;justify-content:center;gap:.35em;
  font-family:var(--display);font-size:1.4em;line-height:1;color:#fff;background:var(--side);border-top:.2em solid var(--ink);text-shadow:0 .08em 0 var(--ink);
  background-image:radial-gradient(circle,rgba(0,0,0,.22) 0 .12em,transparent .16em);background-size:.5em .5em}
.card.neutral .nm{color:var(--ink);text-shadow:none}
.card .pw{flex:none;width:1.95em;height:1.95em;border-radius:50%;background:var(--paper);color:var(--ink);border:.13em solid var(--ink);
  display:grid;place-items:center;font-family:var(--body);font-weight:900;font-size:1.05em;line-height:1;text-shadow:none;letter-spacing:0;font-variant-numeric:lining-nums}
.card .nm span{flex:1;text-align:center;min-width:0}
.card .sh{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.22) 50%,transparent 60%)}
.back-face{background:var(--bg2);display:grid;place-items:center;
  background-image:radial-gradient(circle,rgba(255,255,255,.22) 0 .16em,transparent .2em);background-size:.7em .7em}
.back-face svg{width:56%;filter:drop-shadow(0 .2em 0 var(--ink))}

/* ===== TÍTULO ===== */
#s-title .t1{position:absolute;left:70px;top:80px;font-size:168px;color:var(--yellow);transform:rotate(-4deg);transform-origin:0 100%;
  text-shadow:0 8px 0 var(--ink),0 0 0 var(--ink),0 16px 30px rgba(0,0,0,.5);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill}
#s-title .t2{position:absolute;left:96px;top:262px;font-size:132px;color:var(--red);transform:rotate(-4deg);
  -webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink),0 16px 30px rgba(0,0,0,.5)}
#s-title .fan{position:absolute;right:30px;top:40px;width:470px;height:640px}
#s-title .fan .card{position:absolute;top:40px;left:50%;margin-left:-150px}
#s-title .go{position:absolute;left:70px;bottom:74px}
.rise{animation:rise .7s var(--ease-out) both}
@keyframes rise{from{opacity:0;transform:translateY(34px) scale(.96)}to{opacity:1;transform:none}}
.fan .card{animation:fanin .8s var(--ease-out) both}
@keyframes fanin{from{opacity:0;transform:translateY(60px) rotate(0)}}

/* ===== MENÚ ===== */
.head{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:78px;color:var(--yellow);text-shadow:0 5px 0 var(--ink)}
#hub{position:absolute;left:70px;right:70px;top:124px;bottom:116px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:28px}
.tile{position:relative;border-radius:28px;border:6px solid var(--ink);overflow:hidden;text-align:left;background:var(--bg2);
  box-shadow:0 10px 0 var(--ink),0 18px 28px rgba(0,0,0,.4);transition:transform .16s var(--ease-out),box-shadow .16s var(--ease-out)}
.tile:active{transform:translateY(7px) scale(.985);box-shadow:0 3px 0 var(--ink)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(11,14,51,.92))}
.tile .lb{position:absolute;left:22px;bottom:16px;right:22px;z-index:2;font-family:var(--display);font-size:50px;line-height:.95;color:#fff;text-shadow:0 4px 0 var(--ink)}
.tile .tag{position:absolute;top:16px;right:16px;z-index:2;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:14px;
  font-family:var(--display);font-size:28px;padding:4px 14px;transform:rotate(4deg)}
.tile.soon img{filter:saturate(.45) brightness(.7)}
.tile.soon .tag{background:var(--paper)}
.tile .ic{position:absolute;left:18px;top:14px;z-index:2;width:72px;height:72px;border-radius:50%;background:var(--yellow);border:5px solid var(--ink);display:grid;place-items:center}
.tile .ic svg{width:42px;height:42px}
.tile.soon .ic{background:var(--paper)}

.voice{position:absolute;left:70px;right:70px;bottom:26px;height:64px;display:flex;gap:14px;align-items:center;font-family:var(--display);font-size:36px;color:var(--yellow)}
.voice select{flex:1;min-width:0;height:60px;border-radius:14px;border:4px solid var(--ink);background:var(--paper);color:var(--ink);font:900 21px var(--body);padding:0 14px;text-transform:uppercase}
.voice .btn{height:60px;font-size:34px;padding:0 26px;box-shadow:0 5px 0 var(--ink);border-width:4px}
/* ===== CONFIG ===== */
#s-config .pl{position:absolute;top:120px;width:520px;height:252px;border-radius:26px;border:6px solid var(--ink);padding:22px 26px;
  background:var(--bg2);box-shadow:0 10px 0 var(--ink),0 18px 26px rgba(0,0,0,.35)}
#s-config .pl.a{left:70px;border-top-color:var(--blue)}#s-config .pl.b{right:70px;border-top-color:var(--red)}
.pl .who{font-family:var(--display);font-size:38px;line-height:1;color:var(--yellow)}
.pl input{width:100%;margin-top:10px;height:84px;border-radius:18px;border:5px solid var(--ink);background:var(--paper);color:var(--ink);
  font-family:var(--display);font-size:56px;text-transform:uppercase;padding:0 20px;letter-spacing:.04em}
.pl input::selection{background:var(--blue);color:#fff}
.seg{display:flex;gap:10px;margin-top:12px}
.seg button{flex:1;height:60px;border-radius:16px;border:4px solid var(--ink);background:var(--bg);font-family:var(--display);font-size:32px;
  display:flex;align-items:center;justify-content:center;gap:10px;transition:transform .16s var(--ease-out),background .16s}
.seg button svg{width:34px;height:34px}
.seg button:active{transform:scale(.97)}
.seg button.on{background:var(--yellow);color:var(--ink)}
.steps{position:absolute;left:70px;right:70px;top:402px;display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.stp{border-radius:26px;border:6px solid var(--ink);background:var(--bg2);padding:16px 18px 18px;text-align:center;box-shadow:0 8px 0 var(--ink)}
.stp .lbl{font-family:var(--display);font-size:34px;color:var(--yellow);line-height:1}
.stp .row{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.stp .val{font-family:var(--display);font-size:92px;line-height:1;min-width:110px;color:#fff;text-shadow:0 5px 0 var(--ink)}
.stp .btn{width:76px;height:76px;padding:0;border-radius:50%;font-size:0;box-shadow:0 7px 0 var(--ink)}
.stp .btn svg{width:40px;height:40px}
.hint{position:absolute;left:70px;right:470px;bottom:56px;font-size:25px;line-height:1.25;color:var(--paper)}
.hint.warn{color:var(--yellow)}
#s-config .btn.go{position:absolute;right:70px;bottom:24px}

/* ===== MEMORIA ===== */
.side{position:absolute;top:130px;bottom:34px;width:230px;border-radius:26px;border:6px solid var(--ink);background:var(--bg2);padding:14px;
  transition:transform .3s var(--ease-out),box-shadow .3s var(--ease-out);box-shadow:0 8px 0 var(--ink)}
.side.a{left:30px}.side.b{right:30px}
.side .nm{font-family:var(--display);font-size:46px;line-height:1;text-align:center;text-shadow:0 4px 0 var(--ink)}
.side.a .nm{color:var(--blue)}.side.b .nm{color:var(--red)}
.side .sc{font-family:var(--display);font-size:90px;line-height:1;text-align:center;color:#fff;text-shadow:0 5px 0 var(--ink)}
.side .sc.bump{animation:bump .4s var(--ease-out)}
@keyframes bump{40%{transform:scale(1.3)}}
.side .tray{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;align-content:flex-start;max-height:300px;overflow:hidden}
.thumb{width:44px;height:66px;border:3px solid var(--ink);border-radius:8px;object-fit:cover;object-position:50% 18%;background:var(--ink)}
.thumb.pop{animation:pop .36s var(--ease-out)}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.side.turn{transform:translateY(-6px);box-shadow:0 14px 0 var(--ink),0 0 0 6px var(--yellow)}
.turnflag{position:absolute;left:50%;transform:translateX(-50%);top:-44px;white-space:nowrap;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:14px;
  font-family:var(--display);font-size:28px;padding:0 14px;opacity:0;transition:opacity .2s}
.side.turn .turnflag{opacity:1}
#board{position:absolute;left:280px;right:280px;top:60px;bottom:30px;perspective:1100px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--yellow) var(--bg2)}
#board .bi{position:relative;width:100%}
.slot{position:absolute;transition:transform .16s var(--ease-out)}
.slot:active:not(:disabled){transform:scale(.96)}
.slot[disabled]{pointer-events:none}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .42s var(--ease-out)}
.slot.up .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.fr{transform:rotateY(180deg)}
.slot.nope .flip{animation:nope .45s var(--ease-out)}
@keyframes nope{20%,60%{translate:-8px 0}40%,80%{translate:8px 0}}
.slot.ok .face .card{box-shadow:0 0 0 .3em var(--yellow),0 .5em 1.1em rgba(0,0,0,.5)}
.slot.gone{visibility:hidden}
.fly{position:absolute;z-index:30;background-size:cover;background-position:50% 18%;border:5px solid var(--ink);border-radius:14px;pointer-events:none;will-change:transform}
.banner{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:20;font-size:110px;color:var(--yellow);text-shadow:0 7px 0 var(--ink),0 18px 30px rgba(0,0,0,.5);
  white-space:nowrap;pointer-events:none;opacity:0;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.banner.show{animation:banner 1.5s var(--ease-out) both}
@keyframes banner{0%{opacity:0;transform:scale(.8) rotate(-4deg)}18%{opacity:1;transform:scale(1.05) rotate(-4deg)}80%{opacity:1;transform:rotate(-4deg)}100%{opacity:0;transform:rotate(-4deg)}}

/* ===== EQUIPOS ===== */
#s-team .tt{position:absolute;left:0;right:0;top:22px;text-align:center;font-size:70px;color:var(--yellow);text-shadow:0 5px 0 var(--ink)}
#s-team .tt span{color:#fff}
#coll{position:absolute;left:60px;right:60px;top:130px;height:350px;overflow-y:auto;touch-action:pan-y;scrollbar-width:thin;scrollbar-color:var(--yellow) var(--bg2);display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-content:flex-start;padding-top:20px}
.pick{position:relative;transition:transform .2s var(--ease-out)}
.pick:active{transform:scale(.96)}
.pick.sel{transform:translateY(-14px)}
.pick .ck{position:absolute;top:-14px;right:-14px;width:54px;height:54px;border-radius:50%;background:var(--green);border:5px solid var(--ink);display:grid;place-items:center;
  opacity:0;transform:scale(.6);transition:opacity .16s,transform .2s var(--ease-out);z-index:4}
.pick.sel .ck{opacity:1;transform:none}
.pick .ck svg{width:30px;height:30px}
.pick.sel .card{box-shadow:0 0 0 .3em var(--yellow),0 .5em 1.1em rgba(0,0,0,.5)}
#slots{position:absolute;left:0;right:0;bottom:48px;height:200px;display:flex;gap:26px;justify-content:center;align-items:flex-end}
.slotph{width:120px;height:180px;border:6px dashed rgba(255,244,214,.45);border-radius:18px;display:grid;place-items:center}
.slotph svg{width:60px;height:60px;opacity:.4}
#s-team .btn.go{position:absolute;right:50px;bottom:50px}
#s-team .ai{position:absolute;left:0;right:0;top:300px;text-align:center;font-size:64px;color:var(--paper);text-shadow:0 5px 0 var(--ink)}

/* ===== BATALLA ===== */
.score{position:absolute;top:14px;left:30px;right:30px;height:84px;display:flex;justify-content:space-between;align-items:center}
.score .p{display:flex;align-items:center;gap:16px;background:var(--bg2);border:5px solid var(--ink);border-radius:20px;height:76px;padding:0 24px;box-shadow:0 6px 0 var(--ink)}
.score .p .n{font-family:var(--display);font-size:46px;line-height:1}
.score .p.a .n{color:var(--blue)}.score .p.b .n{color:var(--red)}
.score .p .v{font-family:var(--display);font-size:68px;line-height:1;color:#fff;text-shadow:0 4px 0 var(--ink);min-width:44px;text-align:center}
.score .v.bump{animation:bump .5s var(--ease-out)}
.score .rd{font-family:var(--display);font-size:44px;color:var(--yellow);text-shadow:0 4px 0 var(--ink)}
.team{position:absolute;top:116px;height:250px;width:560px;display:flex;gap:14px;align-items:flex-start;justify-content:center}
.team.a{left:30px}.team.b{right:30px}
.team .card{transition:filter .4s,opacity .4s,transform .5s var(--ease-out)}
.team.win .card{box-shadow:0 0 0 .3em var(--yellow),0 .5em 1.1em rgba(0,0,0,.5)}
.team.lose .card{filter:saturate(.7) brightness(.85)}
.pwr{position:absolute;top:372px;width:300px;height:72px;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--paper);color:var(--ink);
  border:5px solid var(--ink);border-radius:20px;font-family:var(--display);font-size:62px;box-shadow:0 6px 0 var(--ink);opacity:0;transform:translateY(10px);transition:opacity .25s,transform .3s var(--ease-out)}
.pwr.show{opacity:1;transform:none}
.pwr svg{width:44px;height:44px}
.pwr.a{left:160px}.pwr.b{right:160px}
.chips{position:absolute;top:462px;width:560px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips.a{left:30px}.chips.b{right:30px}
.chip{font-family:var(--display);font-size:27px;line-height:1;background:var(--yellow);color:var(--ink);border:4px solid var(--ink);border-radius:12px;padding:5px 12px;
  animation:pop .35s var(--ease-out) both}
.chip b{font-weight:400;color:var(--red)}
.vs{position:absolute;left:50%;top:170px;translate:-50% 0;z-index:6;font-family:var(--display);font-size:150px;color:var(--yellow);line-height:1;opacity:0;
  -webkit-text-stroke:8px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
.vs.show{animation:vs .6s var(--ease-out) both}
@keyframes vs{0%{opacity:0;transform:scale(2.2) rotate(-12deg)}60%{opacity:1;transform:scale(.95) rotate(-6deg)}100%{opacity:1;transform:scale(1) rotate(-6deg)}}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:25}
.cap{position:absolute;left:30px;right:360px;bottom:22px;height:128px;background:var(--paper);color:var(--ink);border:6px solid var(--ink);border-radius:18px;
  padding:12px 22px;display:flex;align-items:center;font-family:var(--display);font-size:46px;line-height:1.02;box-shadow:0 8px 0 var(--ink)}
.cap span{display:block;animation:line .28s var(--ease-out) both}
@keyframes line{from{opacity:0;transform:translateY(10px)}}
#s-battle .btn.next{position:absolute;right:30px;bottom:30px;height:112px;width:310px;font-size:50px;padding:0}
.skip{position:absolute;right:30px;bottom:150px;width:310px;height:56px;font-size:30px;font-family:var(--display);color:var(--paper);opacity:.75}
.fx{position:absolute;pointer-events:none;z-index:40;border-radius:3px;will-change:transform}

/* ===== BIBLIOTECA ===== */
#lib{position:absolute;left:40px;right:40px;top:120px;bottom:20px;overflow-y:auto;display:flex;flex-wrap:wrap;gap:22px;justify-content:center;align-content:flex-start;padding:16px 10px 40px;
  scrollbar-width:thin;scrollbar-color:var(--yellow) var(--bg2)}
#lib::-webkit-scrollbar{width:12px}#lib::-webkit-scrollbar-thumb{background:var(--yellow);border-radius:8px;border:3px solid var(--bg)}
.lc{transition:transform .16s var(--ease-out)}.lc:active{transform:scale(.96)}
#det{position:absolute;inset:0;z-index:10;background:rgba(11,14,51,.94);opacity:0;visibility:hidden;transition:opacity .2s,visibility 0s .2s}
#det.on{opacity:1;visibility:visible;transition:opacity .2s}
#det .big{position:absolute;left:100px;top:90px}
#det .info{position:absolute;left:500px;right:150px;top:30px}
#det h2{margin:0 0 10px;font-family:var(--display);font-weight:400;font-size:74px;line-height:.95;color:var(--yellow);text-shadow:0 5px 0 var(--ink)}
.bar{display:grid;grid-template-columns:200px 1fr 64px;align-items:center;gap:14px;margin-bottom:8px;font-family:var(--display);font-size:32px}
.bar i{display:block;height:28px;border-radius:12px;background:var(--ink);border:4px solid var(--ink);overflow:hidden}
.bar i u{display:block;height:100%;width:var(--v);background:var(--c);border-radius:8px;transform-origin:0 50%;animation:grow .7s var(--ease-out) both;
  background-image:radial-gradient(circle,rgba(0,0,0,.2) 0 2px,transparent 2.5px);background-size:9px 9px}
@keyframes grow{from{transform:scaleX(0)}}
.tags{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 14px}
.tg{font-family:var(--display);font-size:28px;background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:4px 14px}
#det .btn.say{height:58px;font-size:32px;padding:0 20px;gap:10px;border-width:4px;box-shadow:0 5px 0 var(--ink)}
#det .btn.say svg{width:32px;height:32px}
.story{position:relative;background:var(--paper);color:var(--ink);border:5px solid var(--ink);border-radius:18px;padding:12px 20px 14px;font-size:25px;line-height:1.28;font-weight:900;box-shadow:0 6px 0 var(--ink)}
.story .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.story h3{margin:0;font-family:var(--display);font-weight:400;font-size:34px;color:var(--red);line-height:1}
#det .x{position:absolute;right:40px;top:30px;z-index:5}

/* ===== FINAL ===== */
#s-final{text-align:center}
#s-final .tr{position:absolute;left:50%;top:70px;translate:-50% 0;width:220px;filter:drop-shadow(0 10px 0 var(--ink))}
#s-final .w{position:absolute;left:0;right:0;top:300px;font-size:130px;color:var(--yellow);-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
#s-final .sc{position:absolute;left:0;right:0;top:450px;font-family:var(--display);font-size:72px}
#s-final .sc b{font-weight:400;color:#fff;text-shadow:0 4px 0 var(--ink)}
#s-final .act{position:absolute;left:0;right:0;bottom:50px;display:flex;gap:30px;justify-content:center}
.toast{position:absolute;left:50%;bottom:40px;translate:-50% 0;z-index:60;font-family:var(--display);font-size:50px;background:var(--yellow);color:var(--ink);
  border:5px solid var(--ink);border-radius:18px;padding:6px 30px;opacity:0;transform:translateY(14px);transition:opacity .2s,transform .25s var(--ease-out);pointer-events:none}
.toast.on{opacity:1;transform:none}
#rot{position:fixed;inset:0;z-index:100;background:var(--ink);color:var(--yellow);display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  font-family:var(--display);font-size:44px;text-align:center;text-transform:uppercase;padding:30px}
#rot svg{width:120px;height:120px}
@media (orientation:portrait){#rot{display:flex}}
/* cifras claras y rectas para quien está aprendiendo los números */
.score .p .v,.side .sc,.stp .val,.pwr span,.chip b,#s-final .sc b,.bar span:last-child{font-family:var(--body);font-weight:900;letter-spacing:0}
.chip b{font-size:.95em}
@media (prefers-reduced-motion:reduce){
  .rise,.fan .card,.chip,.slot.nope .flip,.thumb.pop,.vs.show{animation-duration:.01ms}
  .flip{transition-duration:.01ms}
  .bar i u{animation:none}
}

<script>
/* ===== DATOS (prototipo: 15 cartas; el juego real tendrá cientos, extraídos una sola vez) ===== */
const TAGS={flyer:'VUELA',magic:'MAGIA',tech:'TECNOLOGÍA',cosmic:'PODER CÓSMICO',brute:'SUPERFUERZA',mind:'SÚPER CEREBRO',speed:'SUPER VELOCIDAD',agil:'ÁGIL'};
const STATL={intelligence:'CEREBRO',strength:'FUERZA',speed:'VELOCIDAD',durability:'AGUANTE',power:'PODER',combat:'COMBATE'};
const STATC={intelligence:'#2fa8ff',strength:'#ff3d52',speed:'#ffd23f',durability:'#35d98a',power:'#ff4fa3',combat:'#ff9a3d'};
const RAW=[{"id": "620", "name": "SPIDER-MAN", "tags": ["agil"], "side": "good", "stats": {"intelligence": 90, "strength": 55, "speed": 67, "durability": 75, "power": 74, "combat": 85}, "img": "img/620.jpg", "story": "Peter Parker era un chico común. Una araña con poderes lo picó y se convirtió en Spider-Man. Trepa paredes, lanza telarañas y siempre ayuda a la gente."}, {"id": "346", "name": "IRON MAN", "tags": ["tech", "flyer"], "side": "good", "stats": {"intelligence": 100, "strength": 85, "speed": 58, "durability": 85, "power": 100, "combat": 64}, "img": "img/346.jpg", "story": "Tony Stark es un genio inventor. Construyó una armadura de metal que vuela y dispara rayos. Así nació Iron Man."}, {"id": "332", "name": "HULK", "tags": ["brute"], "side": "good", "stats": {"intelligence": 88, "strength": 100, "speed": 63, "durability": 100, "power": 98, "combat": 85}, "img": "img/332b.jpg", "story": "El doctor Bruce Banner tuvo un accidente con rayos gamma. Cuando se enoja, se transforma en Hulk, un gigante verde con una fuerza enorme."}, {"id": "69", "name": "BATMAN", "tags": ["mind"], "side": "good", "stats": {"intelligence": 81, "strength": 40, "speed": 29, "durability": 55, "power": 63, "combat": 90}, "img": "img/69b.jpg", "story": "Bruce Wayne no tiene superpoderes. Es muy inteligente y valiente, y usa inventos para cuidar la ciudad de Gotham durante la noche."}, {"id": "644", "name": "SUPERMAN", "tags": ["flyer", "cosmic", "speed", "brute"], "side": "good", "stats": {"intelligence": 94, "strength": 100, "speed": 100, "durability": 100, "power": 100, "combat": 85}, "img": "img/644.jpg", "story": "Superman llegó de bebé desde el planeta Krypton. En la Tierra vuela, es súper fuerte y también es Clark Kent, un periodista."}, {"id": "720", "name": "MUJER MARAVILLA", "tags": ["magic", "brute"], "side": "good", "stats": {"intelligence": 88, "strength": 100, "speed": 79, "durability": 100, "power": 100, "combat": 100}, "img": "img/720b.jpg", "story": "Diana es una princesa guerrera de la isla de las amazonas. Tiene un lazo mágico que hace decir la verdad y brazaletes que frenan cualquier ataque."}, {"id": "659", "name": "THOR REY RÚNICO", "tags": ["magic", "cosmic", "flyer"], "side": "good", "stats": {"intelligence": 69, "strength": 100, "speed": 83, "durability": 100, "power": 100, "combat": 100}, "img": "img/659.jpg", "story": "Thor es el dios del trueno de Asgard. En esta versión se convirtió en el Rey Rúnico, con un poder mágico antiguo enorme."}, {"id": "374", "name": "JUGGERNAUT", "tags": ["brute"], "side": "neutral", "stats": {"intelligence": 44, "strength": 100, "speed": 42, "durability": 100, "power": 85, "combat": 70}, "img": "img/374.jpg", "story": "Cain Marko encontró una joya mágica que lo volvió imparable. Cuando empieza a correr, nadie lo puede frenar."}, {"id": "263", "name": "FLASH", "tags": ["speed"], "side": "good", "stats": {"intelligence": 88, "strength": 48, "speed": 100, "durability": 60, "power": 100, "combat": 60}, "img": "img/263b.jpg", "story": "Barry Allen es un científico de la policía. Un rayo le dio superpoderes y ahora corre más rápido que la luz."}, {"id": "370", "name": "JOKER", "tags": ["mind"], "side": "bad", "stats": {"intelligence": 100, "strength": 10, "speed": 12, "durability": 60, "power": 43, "combat": 70}, "img": "img/370.jpg", "story": "El Joker es el villano más famoso de Gotham. Siempre se ríe y hace bromas peligrosas para molestar a Batman."}, {"id": "655", "name": "THANOS", "tags": ["cosmic", "brute", "mind"], "side": "bad", "stats": {"intelligence": 100, "strength": 100, "speed": 33, "durability": 100, "power": 100, "combat": 80}, "img": "img/655b.jpg", "story": "Thanos es un titán de piel violeta. Quiere juntar las Gemas del Infinito, que dan un poder gigante."}, {"id": "222", "name": "DOCTOR DOOM", "tags": ["magic", "tech", "mind"], "side": "bad", "stats": {"intelligence": 100, "strength": 32, "speed": 20, "durability": 100, "power": 100, "combat": 84}, "img": "img/222.jpg", "story": "Victor von Doom es un genio y también un mago. Gobierna Latveria, usa una armadura de metal y cree que es el mejor del mundo."}, {"id": "204", "name": "DARKSEID", "tags": ["cosmic", "brute", "flyer"], "side": "bad", "stats": {"intelligence": 88, "strength": 100, "speed": 83, "durability": 100, "power": 100, "combat": 95}, "img": "img/204.jpg", "story": "Darkseid manda en el planeta Apokolips. Lanza rayos con los ojos, tiene una fuerza gigante y quiere gobernar todo el universo."}, {"id": "717", "name": "WOLVERINE", "tags": ["agil"], "side": "good", "stats": {"intelligence": 63, "strength": 32, "speed": 50, "durability": 100, "power": 89, "combat": 100}, "img": "img/717.jpg", "story": "Logan tiene garras de metal que salen de sus manos y se cura muy rápido de cualquier herida. Es un integrante de los X-Men."}, {"id": "bwl", "name": "BATMAN QUE RÍE", "tags": ["mind", "magic"], "side": "bad", "stats": {"intelligence": 100, "strength": 55, "speed": 60, "durability": 85, "power": 92, "combat": 100}, "img": "img/bwl.jpg", "story": "Es un Batman de otro universo que se volvió malvado. Su risa da miedo y es muy, muy inteligente. Es uno de los villanos más peligrosos de DC."}];
const CARDS=RAW.map(c=>({...c,pw:Math.round(Object.values(c.stats).reduce((a,b)=>a+b,0)/6)}));
const BYID=Object.fromEntries(CARDS.map(c=>[c.id,c]));

/* ===== UTILIDADES ===== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=$('#stage'), frame=$('#frame');
let SC=1;
function fit(){const w=frame.clientWidth,h=frame.clientHeight;SC=Math.min(w/1280,h/720);
  stage.style.transform=`translate(${(w-1280*SC)/2}px,${(h-720*SC)/2}px) scale(${SC})`}
addEventListener('resize',fit);fit();
const rectIn=e=>{const r=e.getBoundingClientRect(),s=stage.getBoundingClientRect();return{x:(r.left-s.left)/SC,y:(r.top-s.top)/SC,w:r.width/SC,h:r.height/SC}};
const SVGNS='http://www.w3.org/2000/svg';
const icon=(id,cls='')=>`<svg class="${cls}"><use href="#${id}"/></svg>`;
/* ===== SONIDO (todo generado por código) ===== */
let AC=null,MUTED=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type='square',vol=.12,slide=0,when=0){const a=ac();if(!a||MUTED)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
function noise(d,vol=.2,when=0){const a=ac();if(!a||MUTED)return;const n=a.sampleRate*d,b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),g=a.createGain();s.buffer=b;g.gain.value=vol;s.connect(g).connect(a.destination);s.start(a.currentTime+when)}
const SFX={
  tap:()=>tone(520,.07,'triangle',.12),
  flip:()=>{tone(380,.09,'triangle',.14,300)},
  match:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,.16,'square',.1,0,i*.07))},
  no:()=>{tone(220,.22,'sawtooth',.1,-90)},
  slam:()=>{noise(.3,.35);tone(110,.35,'sine',.35,-70)},
  pop:()=>tone(700,.09,'square',.08,500),
  tick:()=>tone(900,.03,'square',.05),
  win:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,.22,'square',.1,0,i*.09))},
  go:()=>{tone(300,.12,'square',.1,300);tone(600,.18,'square',.1,300,.1)}
};
const sfx=n=>{try{SFX[n]()}catch(e){}};
function buzz(ms){try{if(!MUTED&&navigator.vibrate)navigator.vibrate(ms)}catch(e){}}

/* ===== VOZ (la tablet lee en español; el juego real usará frases pregrabadas) ===== */
let VOICE=null,VOICES=[];
function vscore(v){const n=v.name+' '+v.lang;let k=0;
  if(/^es[-_]AR/i.test(v.lang))k+=3;else if(/^es[-_](US|MX|419)/i.test(v.lang))k+=2;else if(/^es/i.test(v.lang))k+=1;
  if(/natural|neural|wavenet|chirp|studio/i.test(n))k+=6;if(/online/i.test(n))k+=3;if(/google/i.test(n))k+=2;if(!v.localService)k+=1;return k}
function loadVoices(){try{VOICES=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang)).sort((a,b)=>vscore(b)-vscore(a))}catch(e){VOICES=[]}
  let saved='';try{saved=localStorage.getItem('bauti_voz')||''}catch(e){}
  VOICE=VOICES.find(v=>v.name===saved)||VOICES[0]||null;
  const sel=$('#vsel');sel.innerHTML=VOICES.length?VOICES.map(v=>`<option value="${v.name}">${v.name} · ${v.lang}</option>`).join(''):'<option>VOZ DEL DISPOSITIVO</option>';

let deck=[],matched=[],faceUp=new Set(),busy=false,left=0,flips=0;
const MINW=88;
function layout(n,W,H){const gap=14;let best=null;
  for(let cols=3;cols<=16;cols++){const rows=Math.ceil(n/cols),w=Math.min((W-gap*(cols-1))/cols,(H-gap*(rows-1))/rows/1.5);if(!best||w>best.w)best={cols,rows,w}}
  if(best.w<MINW){best.cols=Math.max(3,Math.floor((W+gap)/(MINW+gap)));best.rows=Math.ceil(n/best.cols);best.w=Math.min(MINW,(W-gap*(best.cols-1))/best.cols)}
  best.w=Math.floor(best.w);return{...best,gap}}
function sideUpdate(){[0,1].forEach(i=>{const s=$('#sd'+i);s.classList.toggle('turn',S.turn===i);$('.nm',s).textContent=S.names[i]})}

  const pick=shuffle(CARDS).slice(0,Math.min(S.pairs,CARDS.length));deck=shuffle([...pick,...pick].map(c=>c.id));matched=deck.map(()=>false);left=pick.length;

  const offX=(W-totW)/2,offY=totH<H?(H-totH)/2:6;

  deck.forEach((id,i)=>{const r=Math.floor(i/L.cols),c=i%L.cols,s=document.createElement('button');s.className='slot';s.setAttribute('aria-label','CARTA '+(i+1));
    const inRow=r===rowsN-1?deck.length-r*L.cols:L.cols,rowOff=(L.cols-inRow)*(L.w+L.gap)/2;
    s.style.cssText=`width:${L.w}px;height:${L.w*1.5}px;left:${offX+rowOff+c*(L.w+L.gap)}px;top:${offY+r*(L.w*1.5+L.gap)}px;animation:rise .5s var(--ease-out) ${Math.min(i,40)*30}ms both`;
    const f=document.createElement('div');f.className='flip';

    s.onclick=()=>humanFlip(i);bi.append(s)});
  setTimeout(()=>{busy=false;turnStart()},Math.min(deck.length,40)*30+500)}
const slotEl=i=>$$('.slot',$('#board'))[i];

  if(t<b.scrollTop||t+s.offsetHeight>b.scrollTop+b.clientHeight)b.scrollTo({top:Math.max(0,t-(b.clientHeight-s.offsetHeight)/2),behavior:REDUCE?'auto':'smooth'})}
function showCard(i){faceUp.add(i);slotEl(i).classList.add('up');sfx('flip');buzz(8)}
function humanFlip(i){if(busy||S.ai[S.turn]||matched[i]||faceUp.has(i))return;ac();flipCard(i)}
async function flipCard(i){busy=true;showCard(i);await sleep(650);
  const mate=[...faceUp].find(j=>j!==i&&!matched[j]&&deck[j]===deck[i]);
  if(mate!==undefined){await doMatch(mate,i);flips=0;busy=false;if(left>0)turnStart();else endMemory();return}
  sfx('no');flips++;
  if(flips>=2){flips=0;await sleep(450);S.turn^=1;sideUpdate()}
  busy=false;turnStart()}
async function doMatch(a,b){const c=BYID[deck[a]],p=S.turn;matched[a]=matched[b]=true;left--;sfx('match');buzz([20,30,20]);
  const tray=$('.tray',$('#sd'+p));

function fly(src,dst,img,delay=0){const a=rectIn(src),b=rectIn(dst),e=document.createElement('div');e.className='fly';

  return e.animate([{transform:'translate(0,0) scale(1)'},{transform:'translate(0,-30px) scale(1.12)',offset:.2},{transform:`translate(${dx}px,${dy}px) scale(${s})`}],
    {duration:620,delay,easing:'cubic-bezier(.77,0,.175,1)',fill:'both'}).finished.then(()=>e.remove())}

function pickTeam(p,size){return new Promise(async res=>{

/* ===== MOTOR DE REGLAS (decide siempre igual ante el mismo duelo) ===== */
function evaluate(A,B){
  const side=(me,ot)=>{const r=[];let base=me.reduce((s,c)=>s+c.pw,0);
    const cnt={};me.forEach(c=>c.tags.forEach(t=>cnt[t]=(cnt[t]||0)+1));
    Object.entries(cnt).forEach(([t,n])=>{if(n>=2)r.push({k:'syn',tag:t,n,b:6*(n-1)})});
    if(me.length>=2&&me.every(c=>c.side==='good'))r.push({k:'good',b:8});
    if(me.length>=2&&me.every(c=>c.side==='bad'))r.push({k:'bad',b:8});
    const has=(t,x)=>x.some(c=>c.tags.includes(t));
    if(has('flyer',me)&&!has('flyer',ot))r.push({k:'flyer',b:6});
    if(has('cosmic',me)&&!has('cosmic',ot))r.push({k:'cosmic',b:8});
    if(has('speed',me)&&!has('speed',ot))r.push({k:'speed',b:4});
    if(has('magic',me)&&has('tech',ot)&&!has('magic',ot))r.push({k:'mt',b:6});
    if(has('mind',me)&&has('brute',ot)&&!has('mind',ot))r.push({k:'mb',b:6});
    const best=[...me].sort((a,b)=>b.pw-a.pw)[0];
    return{base,r,total:base+r.reduce((s,x)=>s+x.b,0),best}};
  const a=side(A,B),b=side(B,A);return{a,b,win:a.total===b.total?-1:(a.total>b.total?0:1)}}
const NUM=['','','DOS','TRES'];
const VERB={flyer:'VUELAN',magic:'TIENEN MAGIA',tech:'USAN TECNOLOGÍA',cosmic:'TIENEN PODER CÓSMICO',brute:'SON SUPER FUERTES',mind:'SON SUPER INTELIGENTES',speed:'SON SUPER VELOCES',agil:'SON MUY ÁGILES'};
function chipText(x){switch(x.k){
  case'syn':return`${NUM[x.n]||x.n} ${TAGS[x.tag]}`;case'good':return'LOS BUENOS JUNTOS';case'bad':return'LOS MALOS JUNTOS';
  case'flyer':return'VUELAN';case'cosmic':return'PODER CÓSMICO';case'speed':return'SUPER RÁPIDOS';case'mt':return'MAGIA VS TECNOLOGÍA';case'mb':return'CEREBRO VS FUERZA';}return''}
const pickOne=a=>a[rnd(a.length)];
function reasonLine(x){switch(x.k){
  case'syn':return pickOne([`¡${NUM[x.n]||x.n} QUE ${VERB[x.tag]}! ¡JUNTOS SON IMPARABLES!`,`¡MIRÁ ESO! ¡${NUM[x.n]||x.n} QUE ${VERB[x.tag]} Y SE AYUDAN ENTRE ELLOS!`]);
  case'good':return pickOne(['¡LOS BUENOS ESTÁN UNIDOS Y ESO LES DA MÁS FUERZA!','¡CUANDO LOS BUENOS SE JUNTAN, GANAN!']);
  case'bad':return pickOne(['¡LOS MALOS SE UNIERON Y DAN MUCHO MIEDO!','¡LOS MALOS TRABAJAN EN EQUIPO Y ESO ES PELIGROSO!']);
  case'flyer':return pickOne(['¡PUEDEN VOLAR Y EL OTRO EQUIPO NO!','¡ATACAN DESDE EL CIELO Y NADIE LOS ALCANZA!']);
  case'cosmic':return pickOne(['¡TIENEN PODER CÓSMICO, COMO LAS ESTRELLAS!','¡SU PODER VIENE DEL UNIVERSO ENTERO!']);
  case'speed':return pickOne(['¡SON SUPER RÁPIDOS Y NO LOS ATRAPAN!','¡CORREN TANTO QUE NI SE VEN!']);
  case'mt':return pickOne(['¡LA MAGIA LE GANA A LA TECNOLOGÍA!','¡LOS ROBOTS NO SABEN QUÉ HACER CONTRA LA MAGIA!']);
  case'mb':return pickOne(['¡EL CEREBRO LE GANA A LA FUERZA BRUTA!','¡PIENSAN UN PLAN Y LA FUERZA BRUTA NO ALCANZA!']);}return''}
function narrate(res,A,B){
  const L=[],N=S.names;
  L.push(pickOne(['¡QUÉ PELEA!','¡MIRÁ QUÉ DUELO!','¡ESTO SE PONE PICANTE!','¡ATENCIÓN, EMPIEZA EL COMBATE!','¡VAMOS A VER QUIÉN GANA!']));
  L.push(pickOne([`POR UN LADO, ${res.a.best.name}. POR EL OTRO, ${res.b.best.name}.`,`${N[0]} ELIGIÓ A ${res.a.best.name}. ${N[1]} ELIGIÓ A ${res.b.best.name}.`]));
  if(res.win<0){L.push('¡ESTÁN PAREJÍSIMOS, NO SE PUEDE DECIDIR!');L.push('¡EMPATE! ¡PUNTO PARA LOS DOS!');return L}
  const w=res.win?res.b:res.a,l=res.win?res.a:res.b,wn=N[res.win],ln=N[res.win^1];
  const top=[...w.r].sort((x,y)=>y.b-x.b).slice(0,2);
  if(w.base>l.base&&(!top.length||w.base-l.base>top[0].b))L.push(pickOne([`¡${w.best.name} ES MÁS FUERTE QUE ${l.best.name}!`,`¡${w.best.name} TIENE MÁS PODER Y SE NOTA!`]));
  top.forEach(x=>L.push(reasonLine(x)));
  if(A.length!==B.length)L.push('¡Y UN EQUIPO MÁS GRANDE SIEMPRE AYUDA!');
  if(Math.abs(w.total-l.total)<=10)L.push(`¡PERO ${ln} ESTUVO MUY CERCA!`);
  L.push(pickOne([`¡GANA ${wn}! ¡UN PUNTO!`,`¡PUNTO PARA ${wn}!`,`¡${wn} SE LLEVA ESTA RONDA!`]));return L}

/* ===== BATALLA ===== */
let bres=null,bDone=null;

  await countUp([['#pa',res.a.total,res.a.base],['#pb',res.b.total,res.b.base]],stop()?0:700);
  // 5) narración
  for(const t of lines.slice(0,-1)){if(stop())break;cap(t);await speak(t);await sleep(stop()?0:180)}
  // 6) resultado
  cap(lines[lines.length-1]);
  if(res.win>=0){S.score[res.win]++;$(res.win?'#tb':'#ta').classList.add('win');$(res.win?'#ta':'#tb').classList.add('lose');confetti(res.win?900:380)}
  else{S.score[0]++;S.score[1]++;$('#ta').classList.add('win');$('#tb').classList.add('win')}
  [0,1].forEach(i=>{const v=$('#bs'+i);v.textContent=S.score[i];v.classList.remove('bump');void v.offsetWidth;v.classList.add('bump')});
  sfx('win');buzz([30,40,30]);$('#b-skip').hidden=true;
  const last=S.round>=S.rounds;$('#b-next').innerHTML=(last?'¡RESULTADO!':'SIGUIENTE')+icon('i-play');$('#b-next').hidden=false;
  if(!SKIP)await speak(lines[lines.length-1])}
$('#b-skip').onclick=()=>{SKIP=true;stopSpeech()};
$('#b-next').onclick=()=>{SKIP=true;stopSpeech();sfx('go');$('#b-next').hidden=true;nextRound()};
function countUp(items,dur){return new Promise(res=>{if(!dur){items.forEach(([s,to])=>$('span',$(s)).textContent=to);return res()}
  const t0=performance.now();let last=-1;(function f(now){const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3);
    items.forEach(([s,to,from=0])=>$('span',$(s)).textContent=Math.round(from+(to-from)*e));const q=Math.floor(k*10);if(q!==last){last=q;sfx('tick')}
    k<1?requestAnimationFrame(f):res()})(t0)})}
function shake(){const f=$('#flash');if(REDUCE)return;f.animate([{opacity:.85},{opacity:0}],{duration:260,easing:'ease-out'});
  stage.animate([{translate:'0 0'},{translate:'-14px 8px'},{translate:'12px -8px'},{translate:'-8px -4px'},{translate:'4px 4px'},{translate:'0 0'}],{duration:380,easing:'cubic-bezier(.23,1,.32,1)'})}
function confetti(cx){if(REDUCE)return;const cols=['#ffd23f','#ff3d52','#2fa8ff','#35d98a','#ff4fa3','#fff4d6'];
  for(let i=0;i<46;i++){const e=document.createElement('i');e.className='fx';const w=8+rnd(10);e.style.cssText=`left:${cx}px;top:300px;width:${w}px;height:${w*1.5}px;background:${cols[rnd(6)]}`;stage.append(e);
    const dx=(Math.random()-.5)*620,dy=-180-Math.random()*260;
    e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${dx*.6}px,${dy}px) rotate(${rnd(360)}deg)`,opacity:1,offset:.45},{transform:`translate(${dx}px,${dy+520}px) rotate(${rnd(720)}deg)`,opacity:0}],
      {duration:1500+rnd(700),easing:'cubic-bezier(.2,.6,.3,1)',fill:'forwards'}).finished.then(()=>e.remove())}}

/* ===== FINAL ===== */
async function final(){go('final');const [a,b]=S.score,N=S.names;
  $('#fw').textContent=a===b?'¡EMPATE!':`¡GANA ${N[a>b?0:1]}!`;
  $('#fs').innerHTML=`${N[0]} <b>${a}</b> &nbsp;·&nbsp; <b>${b}</b> ${N[1]}`;
  await sleep(300);sfx('win');confetti(640);setTimeout(()=>confetti(400),300);setTimeout(()=>confetti(880),600);
  speak(a===b?'¡Empate! ¡Los dos son campeones!':`¡Ganó ${N[a>b?0:1]}! ¡Qué gran partida!`)}
$('#b-again').onclick=()=>{sfx('go');go('config')};
$('#b-menu').onclick=()=>{sfx('tap');go('hub')};

/* ===== BIBLIOTECA ===== */
function buildLib(){const L=$('#lib');if(L.childElementCount)return;
  CARDS.forEach((c,i)=>{const b=document.createElement('button');b.className='lc rise';b.style.animationDelay=i*30+'ms';b.setAttribute('aria-label',c.name);b.append(cardEl(c,150));b.onclick=()=>{sfx('tap');openDet(c)};L.append(b)})}
function openDet(c){$('#detbig').innerHTML='';$('#detbig').append(cardEl(c,320));
  $('#detinfo').innerHTML=`<h2>${c.name}</h2>`+Object.keys(STATL).map(k=>`<div class="bar"><span>${STATL[k]}</span><i><u style="--v:${c.stats[k]}%;--c:${STATC[k]}"></u></i><span>${c.stats[k]}</span></div>`).join('')+
    `<div class="tags">${c.tags.map(t=>`<span class="tg">${TAGS[t]}</span>`).join('')}</div><div class="story"><div class="hd"><h3>SU HISTORIA</h3><button class="btn say" id="say">${icon('i-snd')} ESCUCHAR</button></div>${c.story}</div>`;
  $('#say').onclick=()=>{ac();SKIP=false;speak(`${c.name}. ${c.story}`)};
  $('#det').classList.add('on')}
$('#detx').onclick=()=>{stopSpeech();sfx('tap');$('#det').classList.remove('on')};
</script>
